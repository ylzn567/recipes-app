<div class="app-layout">
  <!-- סרגל צד / ניווט -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>ספר מתכונים 🍲</h2>
    </div>
    
    <nav class="sidebar-nav">
      <a routerLink="/" class="nav-link">🏠 דף הבית</a>
      
      <!-- אם המשתמש לא מחובר -->
      @if (!authService.isLoggedIn()) {
        <a routerLink="/login" class="nav-link btn-login">🔑 התחברות</a>
        <a routerLink="/register" class="nav-link btn-register">📝 הרשמה</a>
      } @else {
        <!-- אם המשתמש מחובר -->
        <a routerLink="/add-recipe" class="nav-link btn-register" style="margin-bottom: 15px;">➕ הוסף מתכון</a>
        
        @if (authService.isAdmin()) {
          <div style="border-top: 1px solid #e2e8f0; margin: 10px 0; padding-top: 10px;">
            <p style="color: #a0aec0; font-size: 0.85rem; margin-bottom: 5px;">ניהול מערכת</p>
            <a routerLink="/admin/products" class="nav-link" style="color: #4a5568; margin-bottom: 5px;">📋 רשימת מוצרים</a>
            <a routerLink="/admin/allergens" class="nav-link" style="color: #4a5568; margin-bottom: 5px;">🛡️ רשימת אלרגנים</a>
            <a routerLink="/admin/add-product" class="nav-link" style="color: #4a5568; margin-bottom: 5px;">🍎 הוסף מוצר</a>
            <a routerLink="/admin/add-allergen" class="nav-link" style="color: #4a5568; margin-bottom: 15px;">🛡️ הוסף אלרגן</a>
          </div>
        }

        <div class="user-info">
          <p>שלום, <strong>{{ authService.getUsername() }}</strong> 👋</p>
        </div>
        <a href="javascript:void(0)" (click)="onLogout()" class="nav-link btn-logout">🚪 התנתקות</a>
      }
    </nav>
  </aside>

  <!-- תוכן העמוד הראשי (ראוטר) -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
