<div class="allergen-form-container" style="direction: rtl; font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto;">
  <div class="form-card" style="background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <h2 style="color: #2d3748; margin-top: 0; text-align: center;">🛡️ הוספת אלרגן חדש למערכת</h2>
    
    @if (errorMessage) {
      <div class="alert error" style="color: #9b2c2c; background-color: #fff5f5; padding: 10px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #feb2b2;">
        ⚠️ {{ errorMessage }}
      </div>
    }

    @if (successMessage) {
      <div class="alert success" style="color: #22543d; background-color: #c6f6d5; padding: 10px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #c6f6d5;">
        {{ successMessage }}
      </div>
    }

    <form [formGroup]="allergenForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group" style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">שם האלרגן:</label>
        <input type="text" formControlName="name" placeholder="למשל: סלרי" class="form-control" style="width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box;">
        @if (allergenForm.get('name')?.invalid && allergenForm.get('name')?.touched) {
          <small style="color: red; display: block; margin-top: 5px;">יש להזין שם אלרגן תקין (מינימום 2 אותיות)</small>
        }
      </div>

      <button type="submit" [disabled]="isSubmitting || allergenForm.invalid" style="width: 100%; padding: 12px; background-color: #e53e3e; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer;">
        {{ isSubmitting ? 'שומר אלרגן...' : '💾 הוסף אלרגן למאגר' }}
      </button>

    </form>
  </div>
</div>
