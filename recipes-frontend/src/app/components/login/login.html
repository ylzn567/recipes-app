<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>🍳 התחברות</h1>
      <p>ברוכה הבאה! התחברי כדי לנהל את המתכונים שלך</p>
    </div>

    <form (ngSubmit)="onLogin()" class="auth-form">
      <!-- שדה שם משתמש -->
      <div class="form-group">
        <label for="username">שם משתמש</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="username"
          name="username"
          placeholder="הכניסי שם משתמש"
          autocomplete="username"
        />
      </div>

      <!-- שדה סיסמה -->
      <div class="form-group">
        <label for="password">סיסמה</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="הכניסי סיסמה"
          autocomplete="current-password"
        />
      </div>

      <!-- הודעת שגיאה -->
      @if (errorMessage) {
        <div class="error-message">
          ⚠️ {{ errorMessage }}
        </div>
      }

      <!-- כפתור התחברות -->
      <button type="submit" class="btn-primary" [disabled]="isLoading">
        @if (isLoading) {
          <span class="spinner"></span> מתחבר...
        } @else {
          התחברות
        }
      </button>
    </form>

    <!-- לינק להרשמה -->
    <div class="auth-footer">
      <p>עדיין אין לך חשבון? <a routerLink="/register">הירשמי כאן</a></p>
    </div>
  </div>
</div>
